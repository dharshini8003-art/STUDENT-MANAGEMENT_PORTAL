<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Course Management</title>

    <link rel="stylesheet" href="course.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<div class="admin-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="brand">
            <i class="fa-solid fa-graduation-cap"></i>
            <span>Student MS</span>
        </div>

        <ul class="menu">

            <li onclick="openPage('admin.html')">
                <i class="fa-solid fa-chart-line"></i>
                Dashboard
            </li>

            <li onclick="openPage('student.html')">
                <i class="fa-solid fa-user-graduate"></i>
                Students
            </li>

            <li onclick="openPage('faculty.html')">
                <i class="fa-solid fa-chalkboard-user"></i>
                Faculty
            </li>

            <li class="active">
                <i class="fa-solid fa-book"></i>
                Courses
            </li>

            <li onclick="openPage('enrollment.html')">
                <i class="fa-solid fa-user-plus"></i>
                Enrollment
            </li>

            <li onclick="openPage('attendance.html')">
                <i class="fa-solid fa-calendar-check"></i>
                Attendance
            </li>

            <li onclick="openPage('marks.html')">
                <i class="fa-solid fa-square-poll-vertical"></i>
                Marks
            </li>

            <li onclick="openPage('report.html')">
                <i class="fa-solid fa-file-lines"></i>
                Reports
            </li>

        </ul>

        <div class="logout" onclick="logout()">
            <i class="fa-solid fa-right-from-bracket"></i>
            Logout
        </div>

    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">

        <!-- TOPBAR -->
        <header class="topbar">
            <div>
                <h2>Course Management</h2>
                <p>Manage student courses</p>
            </div>

            <div class="admin-profile">
                <i class="fa-solid fa-user-circle"></i>
                Admin
            </div>
        </header>

        <!-- COURSE FORM -->
        <section class="form-card">

            <h3>
                <i class="fa-solid fa-plus"></i>
                Add New Course
            </h3>
            <div class="form-grid"><div>
                <label for="courseName">Course Name</label>
                <input type="text" id="courseName"
                       placeholder="Enter course name" required>
            </div>

                <div>
                    <label for="fees">Fees</label>
                    <input type="number" id="fees"
                           placeholder="25000" min="0" required>
                </div>

                <div>
                    <label for="duration">Duration</label>
                    <input type="text" id="duration"
                           placeholder="Example: 6 Months" required>
                </div>

            </div>
            <button class="primary-btn" onclick="addCourse()">
                <i class="fa-solid fa-plus"></i>
                Add Course
            </button>

        </section>

        <!-- COURSE TABLE -->
        <section class="table-card">

            <div class="table-header">

                <h3>
                    <i class="fa-solid fa-book"></i>
                    Course List
                </h3>

                <button onclick="loadCourses()" class="refresh-btn">
                    <i class="fa-solid fa-rotate"></i>
                    Refresh
                </button>

            </div>

            <div class="table-container">

                <table>
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Course Name</th>
                        <th>fees</th>
                        <th>Duration</th>
                        <th>Action</th>
                    </tr>
                    </thead>

                    <tbody id="courseTable">
                    <tr>
                        <td colspan="5">Loading courses...</td>
                    </tr>
                    </tbody>
                </table>

            </div>

        </section>

    </main>

</div>

<script>

    // ADD COURSE
    async function addCourse() {

        const courseName =
            document.getElementById("courseName").value.trim();

        const fees =
            document.getElementById("fees").value.trim();

        const duration =
            document.getElementById("duration").value.trim();

        if (!courseName || !fees || !duration) {
            alert("Please fill all fields");
            return;
        }

        const course = {
            courseName: courseName,
            fees:Number(fees),
            duration: duration
        };

        try {

            const response = await fetch("/api/courses", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(course)
            });

            if (response.ok) {

                alert("Course added successfully!");

                clearForm();
                loadCourses();

            } else {

                const errorText = await response.text();
                console.error(errorText);
                alert("Failed to add course. Please check the backend.");

            }

        } catch (error) {

            console.error(error);
            alert("Server connection error");

        }
    }

    // LOAD COURSES
    async function loadCourses() {

        const table = document.getElementById("courseTable");

        try {

            const response = await fetch("/api/courses");

            if (!response.ok) {
                throw new Error("Failed to fetch courses");
            }

            const courses = await response.json();

            table.innerHTML = "";

            if (courses.length === 0) {

                table.innerHTML = `
                    <tr>
                        <td colspan="5">No courses found</td>
                    </tr>
                `;

                return;
            }

            courses.forEach(course => {

                const row = document.createElement("tr");

                const idCell = document.createElement("td");
                idCell.textContent = course.id;

                const nameCell = document.createElement("td");
                nameCell.textContent = course.courseName;

                const feesCell = document.createElement("td");
             feesCell.textContent = course.fees;

                const durationCell = document.createElement("td");
                durationCell.textContent = course.duration || "-";

                const actionCell = document.createElement("td");

                const deleteButton = document.createElement("button");
                deleteButton.className = "delete-btn";
                deleteButton.innerHTML =
                    '<i class="fa-solid fa-trash"></i> Delete';

                deleteButton.addEventListener("click", function () {
                    deleteCourse(course.id);
                });

                actionCell.appendChild(deleteButton);

                row.append(
                    idCell,
                    nameCell,
                   feesCell,
                    durationCell,
                    actionCell
                );

                table.appendChild(row);

            });

        } catch (error) {

            console.error(error);

            table.innerHTML = `
                <tr>
                    <td colspan="5">Unable to load courses</td>
                </tr>
            `;

        }
    }

    // DELETE COURSE
    async function deleteCourse(id) {

        if (!confirm("Are you sure you want to delete this course?")) {
            return;
        }

        try {

            const response = await fetch(`/api/courses/${id}`, {
                method: "DELETE"
            });

            if (response.ok) {

                alert("Course deleted successfully!");
                loadCourses();

            } else {

                alert("Failed to delete course");

            }

        } catch (error) {

            console.error(error);
            alert("Server connection error");

        }
    }

    // CLEAR FORM
    function clearForm() {

        document.getElementById("courseName").value = "";
        document.getElementById("fees").value = "";
        document.getElementById("duration").value = "";

    }

    // PAGE NAVIGATION
    function openPage(page) {
        window.location.href = page;
    }

    // LOGOUT
    function logout() {
        window.location.href = "index.html";
    }

    // LOAD DATA WHEN PAGE OPENS
    window.onload = loadCourses;

</script>

</body>
</html>
